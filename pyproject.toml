[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "e-process-authorized-thompson-sampling"
version = "1.0.0"
description = "Paper reproduction code for E-Process-Authorized Thompson Sampling"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["numpy==2.5.2", "matplotlib==3.11.1"]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[tool.setuptools.packages.find]
include = ["eats*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
